[package]
name = "agent-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../agent-core" }
agent-storage = { path = "../agent-storage" }
agent-llm = { path = "../agent-llm" }
agent-workflow = { path = "../agent-workflow", features = ["compression", "memory", "file-storage"] }
agent-context-compression = { path = "../agent-context-compression" }
agent-memory = { path = "../agent-memory" }
agent-file-storage = { path = "../agent-file-storage" }
agent-skill-extraction = { path = "../agent-skill-extraction" }
agent-scheduled-tasks = { path = "../agent-scheduled-tasks" }
agent-skills = { path = "../agent-skills" }
agent-tui = { path = "../agent-tui" }

# CLI
clap = { version = "4", features = ["derive", "env"] }
colored = "2"

# 异步
tokio = { version = "1", features = ["full"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1"

# 数据库（memory 需要）
sqlx = { workspace = true }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4"] }
