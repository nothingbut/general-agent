[package]
name = "agent-workflow"
version.workspace = true
edition.workspace = true

[dependencies]
agent-core = { path = "../agent-core" }
agent-storage = { path = "../agent-storage" }
agent-llm = { path = "../agent-llm" }
agent-skills = { path = "../agent-skills" }
agent-context-compression = { path = "../agent-context-compression", optional = true }
agent-memory = { path = "../agent-memory", optional = true }
agent-file-storage = { path = "../agent-file-storage", optional = true }
agent-mcp = { path = "../agent-mcp", optional = true }
agent-rag = { path = "../agent-rag", optional = true }
agent-multi-agent = { path = "../agent-multi-agent", optional = true }

# 异步运行时
tokio = { version = "1", features = ["full"] }

# Trait 支持
async-trait = "0.1"

# 并发数据结构
dashmap = "5.5"

# 日志
tracing = "0.1"

# UUID
uuid = { version = "1", features = ["v4"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = { workspace = true }
anyhow = { workspace = true }

# 数据库 (用于错误转换)
sqlx = { workspace = true }

# Workflow 专用依赖
petgraph = "0.6"              # DAG 图结构
futures = "0.3"               # Future 工具

[features]
default = []
compression = ["dep:agent-context-compression"]
memory = ["dep:agent-memory"]
file-storage = ["dep:agent-file-storage"]
mcp = ["dep:agent-mcp"]
rag = ["dep:agent-rag"]
multi-agent = ["dep:agent-multi-agent"]

[dev-dependencies]
tokio-test = "0.4"
sqlx = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3.8"
